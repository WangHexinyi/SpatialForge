# Minimal NVIDIA-backed virtual X display for AI2-THOR headless GPU rendering.
# Targets the single NVIDIA GPU that nvidia-smi actually exposes (no host-GPU
# enumeration), so Xorg does not try to open inaccessible host GPUs.
Section "ServerLayout"
    Identifier     "Layout0"
    Screen         "Screen0"
EndSection

Section "Module"
    Load "glx"
EndSection

Section "Device"
    Identifier     "Device0"
    Driver         "nvidia"
    VendorName     "NVIDIA Corporation"
    BusID          "PCI:152:0:0"
    Option         "AllowEmptyInitialConfiguration" "True"
    Option         "Interactive" "False"
EndSection

Section "Screen"
    Identifier     "Screen0"
    Device         "Device0"
    DefaultDepth   24
    SubSection     "Display"
        Depth       24
        Virtual     2048 1024
    EndSubSection
EndSection
